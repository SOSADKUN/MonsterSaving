name: saving_monster
description: Local-first savings companion.
publish_to: none
version: 0.0.1+2
environment:
  sdk: ^3.11.0
dependencies:
  pdfrx_engine: ^0.4.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.36.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  file_picker: ^10.3.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: any
  pdfrx: ^2.4.7
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  video_player: ^2.11.1
dependency_overrides:
  # Android software-first decoding for devices with broken vendor AVC decoders.
  video_player_android:
    path: packages/video_player_android
dev_dependencies:
  video_player_platform_interface: ^6.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/i18n/
    - assets/videos/loading.mp4
    - assets/videos/intro.mp4
    - assets/videos/icon.png
    - assets/videos/background.png
    - assets/images/monster/
    - assets/backgrounds/
